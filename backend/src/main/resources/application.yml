spring:
  application:
    name: extblock
  mvc:
    formcontent:
      filter:
        # 이 앱엔 form 엔드포인트가 없다(JSON + multipart만). 켜 두면 PUT/DELETE urlencoded 본문을
        # RateLimitFilter보다 먼저, 경로와 무관하게 통째로 메모리에 읽는다(SECURITY_REVIEW S1)
        enabled: false
  # multipart 크기 한도는 ExtblockApplication#multipartConfigElement (app.upload.max-file-size 기준)

server:
  port: ${PORT:8080}
  # Tomcat RemoteIpValve: 신뢰하는 프록시가 붙인 X-Forwarded-For만 getRemoteAddr()에 반영
  forward-headers-strategy: native

logging:
  structured:
    format:
      # JSON 한 줄 출력. 파일명 속 개행도 이스케이프되어 로그 인젝션이 성립하지 않음
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  upload:
    max-file-size: 10MB
    storage-dir: /data/uploads
  policy:
    custom-limit: 200
  rate-limit:
    policy-per-minute: 30
    upload-per-minute: 10
